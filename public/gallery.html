<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería Mindful Art</title>

    <link rel="stylesheet" href="/css/gallery.css">
</head>

<body>

    <main class="gallery-container">

        <header class="gallery-header">

            <h1 id="album-name">
                Cargando...
            </h1>

            <p id="album-info"></p>

        </header>

        <section class="gallery-actions" id="gallery-actions">

            <div class="selection-info">
                <span id="selected-count">0</span>
                <span>seleccionados</span>
            </div>

            <div class="selection-buttons">

                <button id="select-all-button">
                    Seleccionar todo
                </button>

                <button id="download-selected-button" disabled>
                    Descargar seleccionados
                </button>

                <button id="download-all-button">
                    Descargar todo
                </button>

            </div>

        </section>

        <section id="gallery">
            <p>Cargando galería...</p>
        </section>
        <div id="lightbox" class="lightbox">

            <button
                id="lightbox-prev"
                class="lightbox-arrow lightbox-prev"
                aria-label="Imagen anterior"
            >
                ‹
            </button>

            <button id="lightbox-close" class="lightbox-close">
                ×
            </button>

            <img
                id="lightbox-image"
                class="lightbox-image"
                src=""
                alt=""
            >

            <button
                id="lightbox-next"
                class="lightbox-arrow lightbox-next"
                aria-label="Imagen siguiente"
            >
                ›
            </button>

        </div>
    </main>

    <script src="/js/gallery.js"></script>

</body>

</html>
